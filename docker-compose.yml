services:
  api:
    image: "${SHM_REPO}/vbios-api:${CORE_VERSION}"
    pull_policy: always
    restart: always
    environment:
      TRUSTED_IPS: ""
      ENABLE_RATE_LIMIT: "${ENABLE_RATE_LIMIT:-false}"
    depends_on:
      - core
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/shm/healthcheck.cgi || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  core:
    image: "${SHM_REPO}/vbios-core:${CORE_VERSION}"
    pull_policy: always
    restart: always
    environment:
      TZ: "${TZ}"
      LANG: C.UTF-8
      WORKERS_COUNT: "${WORKERS_COUNT:-4}"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASS: "${MYSQL_PASS}"
      DB_HOST: "${MYSQL_HOST}"
      DB_PORT: "${MYSQL_PORT}"
      TICKET_S3_ACCESS_KEY: "${TICKET_S3_ACCESS_KEY:-}"
      TICKET_S3_SECRET_KEY: "${TICKET_S3_SECRET_KEY:-}"
    volumes:
      - shm-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  spool:
    image: "${SHM_REPO}/vbios-core:${CORE_VERSION}"
    pull_policy: always
    restart: always
    deploy:
      replicas: 2
    environment:
      TZ: "${TZ}"
      LANG: C.UTF-8
      SHM_ROLE: spool
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASS: "${MYSQL_PASS}"
      DB_HOST: "${MYSQL_HOST}"
      DB_PORT: "${MYSQL_PORT}"
      TICKET_S3_ACCESS_KEY: "${TICKET_S3_ACCESS_KEY:-}"
      TICKET_S3_SECRET_KEY: "${TICKET_S3_SECRET_KEY:-}"
    volumes:
      - shm-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    pull_policy: always
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy

  admin:
    image: "${SHM_REPO}/vbios-admin:${ADMIN_VERSION:-latest}"
    pull_policy: always
    restart: always
    environment:
      SHM_HOST: http://api
      SHM_BASE_PATH: /
      VITE_SHOW_SWAGGER: "false"
    ports:
      - "${ADMIN_PORT}:80"
    depends_on:
      api:
        condition: service_healthy

  client:
    image: "${CLIENT_VERSION}"
    pull_policy: always
    restart: always
    environment:
      SHM_HOST: http://api
      SHM_BASE_PATH: /
      APP_NAME: vBios
      OTP_ENABLE: "true"
      TELEGRAM_BOT_AUTH_ENABLE: "false"
      TELEGRAM_BOT_NAME: vbiosbot
      TELEGRAM_BOT_AUTH_PROFILE: telegram_bot
      TELEGRAM_OIDC_AUTH_ENABLE: "true"
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:lts
    restart: always
    environment:
      TZ: "${TZ}"
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASS}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASS}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" --silent']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:latest
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
    driver: local
  shm-data:
    driver: local

