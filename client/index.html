<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,body{margin:0;min-height:100%;background:#101112;color:#e5e7e8;font-family:system-ui,sans-serif}
      .boot-screen{min-height:100vh;display:grid;place-content:center;gap:16px;text-align:center}
      .boot-spinner{width:32px;height:32px;margin:auto;border:3px solid #30383d;border-top-color:#65cbe8;border-radius:50%;animation:boot-spin 1s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
    </style>
    <title>vBios — личный кабинет</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="vbios-icon.svg" />
    <meta name="description" content="vBios — удобный личный кабинет для услуг и подписок" />
    <meta property="og:title" content="vBios — личный кабинет" />
    <meta property="og:description" content="Услуги, подписки, оплата и поддержка в одном месте" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="favicon.jpg" />
    <script src="/telegram-web-app-56-min.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status"><span class="boot-spinner" aria-hidden="true"></span><span>Загружаем кабинет…</span></div></div>
    <noscript>Для работы кабинета включите JavaScript в браузере.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
