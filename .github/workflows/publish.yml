name: Build and publish vBios images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl test dependencies
        run: sudo apt-get update && sudo apt-get install -y libjson-perl libwww-perl liburi-perl
      - name: Check ticket delivery and responder selection
        run: prove help-apps-test.t media-multipart-test.t media-private-copy-test.t ticket-delivery-test.t support-caption-test.t oidc-cabinet-test.t security-boundaries-test.t telegram-binding-test.t telegram-oidc-identity-test.t telegram-widget-binding-test.t telegram-oidc-verification-test.t
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vbios-core
            context: ./server
            target: core
          - image: vbios-api
            context: ./server
            target: api
          - image: vbios-clients
            context: ./client
            target: client
          - image: vbios-admin
            context: ./admin
            target: admin
    steps:
      - uses: actions/checkout@v4
      - name: Prepare backend version metadata
        if: matrix.context == './server'
        shell: bash
        run: |
          # SHM reads this file during init and exposes it through /admin/system/version.
          VERSION="$(git tag --sort=-v:refname | head -n1 | sed 's/^v//' || true)"
          VERSION="${VERSION:-3.7.0}"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          cat > server/app/version.json <<EOF
          {
            "version": "${VERSION}-${SHORT_SHA}",
            "commitSha": "${GITHUB_SHA}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          }
          EOF
          cat server/app/version.json
      - name: Normalize registry owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  notify:
    name: Notify about published commit
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets are not configured; notification skipped."
            exit 0
          fi

          SUBJECT="$(git log -1 --pretty=%s)"
          AUTHOR="$(git log -1 --pretty='%an')"
          FILES="$(git diff-tree --no-commit-id --name-only -r HEAD | head -20)"
          [[ -n "${FILES}" ]] || FILES="Изменения опубликованы в Docker-образах."

          MESSAGE=$(cat <<EOF
🔔 Обновление личного кабинета

📦 Репозиторий: ${REPOSITORY}
🌿 Ветка: ${BRANCH}
🔖 Коммит: ${COMMIT_SHA:0:7}
👤 Автор: ${AUTHOR} (${ACTOR})

📝 Что изменилось:
${SUBJECT}
${FILES}

🚀 Как обновить кабинет на сервере

Сначала дождитесь успешной сборки и публикации Docker-образов в GitHub Actions.

Затем в папке с docker-compose.yml выполните:

docker compose pull client admin core api
docker compose up -d --no-deps --force-recreate client admin core api

🔎 Проверить состояние:
docker compose ps
docker compose logs --tail=50 client admin core api

🔗 ${COMMIT_URL}
EOF
          )

          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

