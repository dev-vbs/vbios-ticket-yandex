name: Сборка приложения vBios

on:
  push:
    branches: [main]
    tags: ['cabinet-v*']
    paths: ['cabinet-app/**', '.github/workflows/cabinet-app.yml']
  pull_request:
    paths: ['cabinet-app/**', '.github/workflows/cabinet-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
            options: --release
            output: cabinet-app/build/windows/x64/runner/Release/
          - os: ubuntu-latest
            target: apk
            options: --debug
            output: cabinet-app/build/app/outputs/flutter-apk/app-debug.apk
          - os: macos-latest
            target: ios
            options: --release --no-codesign
            output: cabinet-app/build/ios/iphoneos/Runner.app/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
      - name: Указать JDK для Flutter
        if: matrix.target == 'apk'
        shell: bash
        run: flutter config --jdk-dir="$JAVA_HOME"
      - name: Подготовить платформенные проекты
        shell: pwsh
        run: ./cabinet-app/bootstrap.ps1
      - name: Проверить код
        working-directory: cabinet-app
        run: flutter analyze
      - name: Собрать приложение
        working-directory: cabinet-app
        run: flutter build ${{ matrix.target }} ${{ matrix.options }}
      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-${{ matrix.target }}
          path: ${{ matrix.output }}
          if-no-files-found: error

      - name: Упаковать сборку для Releases
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cabinet-v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-files | Out-Null
          switch ('${{ matrix.target }}') {
            'windows' {
              Compress-Archive -Path 'cabinet-app/build/windows/x64/runner/Release/*' -DestinationPath 'release-files/vBios-windows-x64.zip'
            }
            'apk' {
              Copy-Item 'cabinet-app/build/app/outputs/flutter-apk/app-debug.apk' 'release-files/vBios-android-debug.apk'
            }
            'ios' {
              ditto -c -k --sequesterRsrc --keepParent 'cabinet-app/build/ios/iphoneos/Runner.app' 'release-files/vBios-ios-unsigned.zip'
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cabinet-v')
        with:
          name: release-${{ matrix.target }}
          path: release-files/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cabinet-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Опубликовать сборки
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* --verify-tag --prerelease --latest=false \
              --title "vBios Cabinet ${RELEASE_TAG#cabinet-v}" \
              --notes "Windows: распакуйте ZIP и запустите EXE из извлечённой папки. Android: APK для тестирования. iOS: неподписанная сборка, для установки нужна подпись Apple."
          fi
